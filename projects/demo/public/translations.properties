# Klíč se skládá jako screen.<obrazovka>.<id prvku>.<atribut>. Když klíč existuje, přebije hodnotu
# napsanou v `attributes` v YAML obrazovky. Soubor se načítá za běhu — úprava textu nevyžaduje build,
# stačí uložit a obnovit stránku.
