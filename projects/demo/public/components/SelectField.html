<template>
    <label class="co-select-field">
      <span class="co-select-field__box{{showError ? ' co-select-field__box--error' : ''}}">
        <span class="co-select-field__text">
          <template data-if="selected">
            <span class="co-select-field__caption">{{label}}</span>
            <span class="co-select-field__value">{{selected.label}}</span>
          </template>
          <span data-else class="co-select-field__placeholder">{{label}}</span>
        </span>
        <span class="co-select-field__caret">
          <img src="{{base}}resources/icon-caret-down.svg" alt="" width="16" height="9" />
        </span>
      </span>
      <select
        class="co-select-field__select"
        :value="value ?? ''"
        data-on-change="change"
        data-on-blur="blur"
      >
        <option value="" disabled hidden>{{label}}</option>
        <option data-for="opt in options" data-key="opt.value" :value="opt.value">{{opt.label}}</option>
      </select>
      <span data-if="showError" class="co-select-field__error">{{errorMessage}}</span>
    </label>
  </template>

  <style>
    .co-select-field {
        position: relative;
        display: block;
    }

    .co-select-field__box {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 8px 12px;
        border-radius: 4px 4px 0 0;
        background: var(--surface-variant);
        border-bottom: 2px solid var(--control-border);
        transition: border-color 0.15s;
    }

    .co-select-field__box:focus-within {
        border-bottom-color: var(--accent);
    }

    .co-select-field__box--error {
        border-bottom-color: var(--danger);
    }

    .co-select-field__text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .co-select-field__placeholder {
        font-size: 16px;
        line-height: 24px;
        color: var(--text-muted);
    }

    .co-select-field__caption {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-muted);
    }

    .co-select-field__value {
        font-size: 16px;
        font-weight: 500;
        line-height: 24px;
        color: var(--text);
    }

    .co-select-field__caret {
        flex-shrink: 0;
        display: flex;
        color: var(--text-muted);
    }

    .co-select-field__select {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        border: none;
        cursor: pointer;
    }

    .co-select-field__error {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        line-height: 16px;
        color: var(--danger);
    }
  </style>

  <script>
    export default {
      field: true,
      validatable: true,
      defaults: { label: "", options: [] },
      state: { touched: false },
  
      compute: ({ props, state, lib }) => {
        const errorMessage = lib.getValidationError(props.value ?? "", props.validators);
        return {
          selected: props.options.find((opt) => opt.value === props.value),
          errorMessage,
          // Chyby zůstanou skryté, dokud pole neopustíš nebo dokud je neodhalí zablokované odeslání.
          showError: Boolean(errorMessage) && (state.touched || props.forceShowError),
        };
      },
  
      on: {
        change: ({ props }, event) => props.onChange?.(event.target.value),
        blur: ({ setState }) => setState({ touched: true }),
      },
    };
  </script>
