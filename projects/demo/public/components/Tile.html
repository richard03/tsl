<template>
    <div
      class="{{className}}"
      :on-click="onClick"
      :on-key-down="keyHandler"
      :role="onClick ? 'button' : undefined"
      :tab-index="onClick ? 0 : undefined"
    >
        <slot></slot>
    </div>
  </template>
  
  <style>
    .co-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), 0 1px 3px 1px rgba(0, 0, 0, 0.1);
      padding: 16px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .co-tile--clickable {
      cursor: pointer;
    }

    .co-tile--clickable:hover {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
    }

    .co-tile--clickable:active {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), 0 1px 3px 1px rgba(0, 0, 0, 0.1);
    }

    .co-tile--clickable:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
  
  <script>
    export default {
      // `action` říká enginu, ať dlaždici předá `onClick` sestavené z `action:` v obrazovce.
      // Potomky ze <slot> si přitom nechá — klikatelná dlaždice je pořád kontejner.
      action: true,

      defaults: { type: "account", label: "", showAmount: true },
  
      compute: ({ props }) => ({
        className:
          `co-tile co-tile--${props.type}` +
          (props.onClick ? " co-tile--clickable" : ""),
        // Klávesnicí se dá ovládat jen klikatelná dlaždice — odpovídá to role/tabindex výš.
        keyHandler: props.onClick
          ? (e) => {
              if (e.key === "Enter" || e.key === " ") props.onClick();
            }
          : undefined,
      }),
    };
  </script>
