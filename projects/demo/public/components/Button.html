<template>
  <button
    type="button"
    class="co-button co-button--{{type}}"
    :disabled="disabled"
    data-on-click="click"
  >
    {{label}}
  </button>
</template>

<style>
  .co-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, filter 0.15s;
  }

  .co-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
  }

  .co-button--primary {
      background-color: var(--accent);
      color: var(--accent-contrast);
  }

  .co-button--primary:hover:not(:disabled) {
      filter: brightness(1.08);
  }

  .co-button--primary:active:not(:disabled) {

  }

  .co-button--secondary {

      border: 1px solid var(--control-border);

  }

  .co-button--secondary:hover:not(:disabled) {
      background-color: var(--accent-soft);
  }

  .co-button--secondary:active:not(:disabled) {
      background-color: var(--accent-soft);

<script>
  export default {
    // `action` říká enginu, ať tlačítku předá `onClick` sestavené z `action:` v obrazovce.
    action: true,
    // `gated` k tomu přidá `disabled`, dokud má obrazovka nevyplněná nebo chybná pole.
    gated: true,

    defaults: { label: "", type: "primary" },

    on: { click: ({ props }) => props.onClick?.() },
  };
